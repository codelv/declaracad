image: continuumio/miniconda3:latest

tests:
  script:
    - apt-get update -q -y
    - apt-get install -y libgl1-mesa-glx

    # Create env
    - conda env create -f environment.yml

    # Reinit
    - conda init bash
    - source ~/.bashrc

    # Activate env
    - source activate declaracad
    - conda info

    # Install declaracad
    - pip install -e .

    - ls /usr/lib/x86_64-linux-gnu/
    - ls /opt/conda/envs/declaracad/lib
    - rm /usr/lib/x86_64-linux-gnu/libstdc++.so.6
    - ln -s /opt/conda/envs/declaracad/lib/libstdc++.so.6 /usr/lib/x86_64-linux-gnu/libstdc++.so.6

    # Install testing utils
    - pip install pytest pytest-coverage pytest-qt
    - pytest tests -v --cov declaracad
