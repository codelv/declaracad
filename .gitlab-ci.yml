image: continuumio/miniconda3:latest

tests:
  script:
    - apt-get update -q -y
    - apt-get install -y build-essential libgl1-mesa-glx

    # Create env
    - conda env create -f environment.yml

    # Install declaracad
    - conda run -n declaracad pip install -e .

    # Install testing utils
    - conda run -n declaracad pip install pytest pytest-coverage pytest-qt
    - conda run -n declaracad pytest tests -v --cov declaracad
