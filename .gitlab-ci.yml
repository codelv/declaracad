image: mambaorg/micromamba:jammy
cache:
    # Cache pip/conda downloads
    paths:
        - ../../opt/conda/pkgs
        - .cache/pip

before_script:
    # Create env
    - micromamba install -y -n base -f environment.yml

    # Install gl depends and add path to load conda libs
    - micromamba install -y -n base -c conda-forge \
        mesa-libegl-devel-cos7-x86_64 \
        mesa-libgl-devel-cos7-x86_64 \
        mesa-libgbm-cos7-x86_64 \
        libx11-devel-cos7-x86_64 \
        libxext-devel-cos7-x86_64 \
        libxrender-devel-cos7-x86_64 \
        libxdamage-devel-cos7-x86_64 \
        libxfixes-devel-cos7-x86_64 \
        libxxf86vm-devel-cos7-x86_64 \
        freetype-devel-cos7-x86_64 \
        fontconfig-devel-cos7-x86_64 \
        libxshmfence-devel-cos7-x86_64 \
        libxcb-devel-cos7-x86_64 \
        libpng-devel-cos7-x86_64 \
        libxau-devel-cos7-x86_64 \
        glib2-devel-cos7-x86_64 \
        libxkbcommon \
        pcre \
        dbus
    - export LD_LIBRARY_PATH="/opt/conda/x86_64-conda-linux-gnu/sysroot/usr/lib:/opt/conda/lib"
    - ln -s /opt/conda/x86_64-conda-linux-gnu/sysroot/usr/lib64/libEGL_mesa.so.0 /opt/conda/x86_64-conda-linux-gnu/sysroot/usr/lib/libEGL.so.1

    # Wayland
    - micromamba install -y -n base -c dtk-forge6 -c conda-forge wayland

    # GDB
    - micromamba install -y -n base -c conda-forge gdb

    # Create env
    - micromamba install -y -n base -f environment.yml
    - pip install -e ./

    # Test Qt
    - export QT_QPA_PLATFORM=offscreen
    - export FORCE_QT_API=pyqt6
    - python -c "from PyQt6 import QtWidgets"

    # Install testing utils
    - pip install pytest pytest-coverage pytest-qt enaml-coverage-plugin

    # Install qa tools
    - pip install black flake8 isort mypy

tests:
  script:
    # Run checks
    - isort --profile=black --check --diff declaracad tests
    - black --check --diff declaracad tests
    - flake8 --ignore=E501,E203,W503 declaracad tests
    # - yes | mypy declaracad --install-types || true
    #- mypy declaracad --ignore-missing-imports

    # Run tests
    #- gdb -ex run -ex bt -ex quit --args python -m pytest tests -v --cov declaracad
    - pytest tests -v --cov declaracad

