image: continuumio/miniconda3:latest

tests:
  script:
    - apt-get update -q -y
    - apt-get install -y build-essential libgl1-mesa-glx

    # Create env
    - conda env create -f environment.yml

    # Reinit
    - conda init bash
    - source ~/.bashrc

    # Activate env
    - source activate declaracad
    - conda info

    # Install declaracad
    - pip install -e .

    - ls /opt/conda/envs/declaracad/lib

    - export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:/opt/conda/envs/declaracad/lib"

    # Install testing utils
    - pip install pytest pytest-coverage pytest-qt
    - pytest tests -v --cov declaracad
