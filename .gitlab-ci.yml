image: continuumio/miniconda3:master

tests:
  script:
    - apt-get update -q -y
    - apt-get install -y libgl1-mesa-glx

    # Create env
    - conda env create -f environment.yml

    # Activate env
    - source activate declaracad
    - conda info

    # Install declaracad
    - pip install -e .

    # Install testing utils
    - pip install pytest pytest-coverage pytest-qt
    - pytest tests -v --cov declaracad
