image: continuumio/miniconda3:master

tests:
  script:
    - apt-get update -q -y
    - DEBIAN_FRONTEND=noninteractive apt-get install -y libgl1-mesa-glx xserver-xorg xvfb gdb

    # Create env
    - conda env create -f environment.yml

    # Activate env
    - source activate declaracad
    - conda info

    # Install declaracad
    - pip install -e .

    # Install testing utils
    - pip install pytest pytest-coverage pytest-qt enaml-coverage-plugin

    # Make Qt Happy
    # - export QT_DEBUG_PLUGINS=1
    - export QT_QPA_PLATFORM=offscreen

    # Run
    - pytest tests -v --cov declaracad
    #- xvfb-run -s "-screen 0 1920x1080x24 +extension GLX +extension RENDER" gdb -ex run -ex bt -ex quit --args python -m pytest tests -v -s
