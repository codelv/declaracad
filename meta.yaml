package:
  name: declaracad
  version: 0.4.0dev

channels:
  - conda-forge
  - trelau
  - codelv

source:
  path: "./"

requirements:
  run:
  - python
  - pyocct
  - pysmesh
  - pychrono
  - pyqt
  - pyqtwebengine
  - enaml
  - lxml
  - pyserial ==3.5
  - qscintilla2
  - qtconsole
  - pyflakes
  - markdown
  - numpydoc
  - jsonpickle
  - pywin32 # os[win32]
  pip:
    - enamlx
    - qt-reactor


build:
  number: 0
  noarch: python
  script:
    - python setup.py install --single-version-externally-managed --record=record.txt
  entry_points:
    - declaracad = declaracad:main

test:
  imports:
    - declaracad.editor.plugin
    - declaracad.occ.occ_algo
    - declaracad.occ.qt.qt_occ_viewer

about:
  home: https://declaracad.com
  summary: "A declarative parametric 3D modeling application using python"
  license: GPLv3
